# CodeQL configuration for ServiceHub 4.1.0
name: "ServiceHub CodeQL Config"

queries:
  - uses: security-extended   # includes security-and-quality queries

# No query is excluded. (Until 2026-10-03 this file switched off cs/insecure-direct-object-reference on the grounds that nothing carries an
# owner; 4.1.0 partitions every namespace and ledger row by owner and narrows reads by an allow-list, so that rule is exactly the one to keep.)

paths-ignore:
  # The frozen 4.0.0 tree: a parts bin that is never built, run or shipped from here.
  - "archive/**"
  # Tests and the documentation tooling use deliberately fake credentials and made-up data.
  - "tests/**"
  - "scripts/**"
