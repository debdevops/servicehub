# Publishes a ServiceHub Docker image to GitHub Container Registry on every version tag push.
# v4.0.x builds the ARCHIVED 4.0.0 codebase (archive/servicehub-4.0.0/); v4.1.x builds the repo root. The
# tag must equal the selected codebase's own .version (verify-release-tag.sh, ADR-0013 D6), so one
# generation can never be published as the other's release. Main CI only builds and smoke-tests the image.
#
# Image: ghcr.io/<owner>/servicehub
# Tags pushed per release: the full semver (X.Y.Z), the X.Y minor-version alias, and
# `latest`. First publish requires making the package public in GitHub → Packages
# (new GHCR packages default to private).
name: Publish Container Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select the codebase for this tag (refuses a tag that does not match it)
        # ADR-0013 D6. v4.0.x → archive/servicehub-4.0.0, v4.1.x → repo root; the tag must equal that .version.
        id: codebase
        run: .github/scripts/verify-release-tag.sh "${{ github.ref_type }}" "${{ github.ref_name }}"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.codebase.outputs.context }}
          file: ${{ steps.codebase.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
