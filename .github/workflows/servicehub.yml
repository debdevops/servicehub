# CI workflow: build + unit tests on every push/PR. See deploy.yml for production deployment.
name: CI – Build & Unit Tests

on:
  push:
    branches:
      - main
      - develop
      - 'release'
      - 'bugfix/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release'
      - 'bugfix/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'


env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test-backend:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore services/api/ServiceHub.sln

      - name: Audit NuGet packages for known vulnerabilities
        run: |
          echo "=== dotnet list package --vulnerable (incl. transitive), per project ==="
          # Every project under services/api/src is audited explicitly by path, not just
          # whatever the .sln happens to reference — ServiceHub.Infrastructure.Aws and .Gcp
          # were previously absent from the solution and went unaudited entirely, so solution
          # membership alone isn't trusted here. NU1903 is no longer suppressed in any
          # project's <NoWarn>, so TreatWarningsAsErrors now genuinely blocks vulnerable
          # *direct* packages at build time; this step additionally surfaces transitive
          # advisories in CI.
          REPORT=""
          for PROJECT in $(find services/api/src -name '*.csproj' | sort); do
            echo "--- $PROJECT ---"
            PROJECT_REPORT=$(dotnet list "$PROJECT" package --vulnerable --include-transitive 2>&1 || true)
            echo "$PROJECT_REPORT"
            REPORT="$REPORT
          $PROJECT_REPORT"
          done
          if echo "$REPORT" | grep -qiE '\b(High|Critical)\b'; then
            echo "❌ High/Critical severity vulnerabilities found in NuGet dependencies."
            exit 1
          fi
          echo "✅ No high/critical NuGet vulnerabilities detected"

      - name: Build solution
        run: dotnet build services/api/ServiceHub.sln --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test services/api/tests/ServiceHub.UnitTests/ServiceHub.UnitTests.csproj \
            --configuration Release \
            --settings services/api/coverlet.runsettings \
            --results-directory services/api/TestResults \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx"

      - name: Run integration tests
        run: |
          dotnet test services/api/tests/ServiceHub.IntegrationTests/ServiceHub.IntegrationTests.csproj \
            --configuration Release \
            --settings services/api/coverlet.runsettings \
            --results-directory services/api/TestResults \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=integration-results.trx"

      - name: Start API in Development mode (AI unavailable) for degradation check
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5153
          Configuration__SkipLocalSettings: "true"
          # AI degradation gate: AI is enabled but ServiceUrl points at a port nothing binds
          # in this job (no AI container is started here), standing in for "AI container
          # stopped". This proves the API degrades cleanly — logging unavailability exactly
          # once, not spamming — when the AI service is unreachable, per the RC1 single-
          # container install story. See AIServiceClient for the degrade-to-"not available"
          # contract.
          AI__Enabled: "true"
          AI__ServiceUrl: "http://127.0.0.1:18081"
        run: |
          dotnet run \
            --project services/api/src/ServiceHub.Api/ServiceHub.Api.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile > /tmp/servicehub_degradation_api.log 2>&1 &
          echo "DEGRADATION_API_PID=$!" >> $GITHUB_ENV
          echo "API started with PID $!"

      - name: Wait for degradation-check API health check
        run: |
          echo "Waiting for API to be ready (up to 120s)..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5153/health/live 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API is ready after $((i * 2))s (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  ...${i}s — HTTP $HTTP_CODE"
            sleep 2
          done
          echo "❌ API did not become ready within 120s"
          tail -60 /tmp/servicehub_degradation_api.log 2>/dev/null || echo "(no log file)"
          exit 1

      - name: Wait for AI degradation cycle to run
        # AnomalyDetectionWorker's first health check against the AI service fires ~30s
        # after startup — give it time to run and log before checking the log below.
        run: sleep 35

      - name: Verify AI unavailability is logged once, not spammed
        run: |
          # Match only the timestamped-bracket formatter's single-line output, not the stock
          # console formatter's two-line "warn: Category[0]\n      message" form — both write
          # the same single log event, and matching both would double-count every occurrence.
          COUNT=$(grep -c "\[WARNING\].*AIServiceClient.*AI service is unavailable" /tmp/servicehub_degradation_api.log || true)
          echo "AI unavailability log occurrences: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ Expected at least one AI unavailability log line — degradation path was not exercised"
            tail -100 /tmp/servicehub_degradation_api.log
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "❌ AI unavailability was logged $COUNT times — expected exactly once per process (log spam)"
            grep -n "AI service is unavailable" /tmp/servicehub_degradation_api.log
            exit 1
          fi
          echo "✅ AI unavailability logged exactly once, no spam"

      - name: Stop degradation-check API
        if: always()
        run: kill ${{ env.DEGRADATION_API_PID }} 2>/dev/null || true

      - name: Install report generator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool \
            --version 5.4.3 2>/dev/null || true

      - name: Generate coverage report and enforce 60% threshold
        run: |
          reportgenerator \
            -reports:"services/api/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"services/api/TestResults/CoverageReport" \
            -reporttypes:"TextSummary"

          echo "=== Coverage Summary ==="
          cat services/api/TestResults/CoverageReport/Summary.txt

          COVERAGE=$(grep -oP 'Line coverage: \K[\d.]+' \
            services/api/TestResults/CoverageReport/Summary.txt || echo "0")

          echo "Line coverage: ${COVERAGE}%"

          if awk "BEGIN {exit !($COVERAGE < 60)}"; then
            echo "❌ Coverage ${COVERAGE}% is below the required 60% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the 60% threshold"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-${{ github.run_number }}
          path: services/api/TestResults/CoverageReport/
          retention-days: 14

  build-and-test-frontend:
    name: Build & Test Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo workspace)
        run: npm ci --include=optional

      - name: Run ESLint
        run: npm run -w apps/web lint

      - name: Audit npm packages for vulnerabilities
        run: |
          echo "=== npm audit — checking for known vulnerabilities (monorepo workspace) ==="
          # --audit-level=high: fail only on HIGH or CRITICAL severity
          # --omit=dev: skip dev dependencies (they don't run in production)
          #
          # ACCEPTED_ADVISORIES: advisories we've reviewed and judged not applicable to
          # how this app uses the package. Each entry must have a reason; re-review on
          # every dependency bump.
          #   - GHSA-qwww-vcr4-c8h2 (react-router "RSC Mode" CSRF bypass): only reachable
          #     via React Router's RSC/framework-mode server actions. This app is a
          #     client-only Vite SPA using createBrowserRouter — no RSC, no server
          #     actions — so the vulnerable code path is unreachable. Full fix requires
          #     react-router-dom v8 (breaking change); tracked separately.
          ACCEPTED_ADVISORIES="GHSA-qwww-vcr4-c8h2"

          AUDIT_JSON=$(npm audit --audit-level=high --omit=dev --workspace=apps/web --json || true)
          UNACCEPTED=$(echo "$AUDIT_JSON" | jq -r --arg accepted "$ACCEPTED_ADVISORIES" '
            ($accepted | split(",")) as $ignore
            | [.vulnerabilities[]? | select(.severity == "high" or .severity == "critical")
                | .via[]? | select(type == "object") | .url]
            | unique
            | map(select(. as $u | $ignore | any($u | contains(.)) | not))
            | .[]
          ')

          if [ -n "$UNACCEPTED" ]; then
            echo "❌ High/critical severity vulnerabilities found in production npm dependencies:"
            echo "$UNACCEPTED"
            echo "   Run 'npm audit' locally to see details and 'npm audit fix' to fix automatically."
            exit 1
          fi
          echo "✅ No unaccepted high/critical npm vulnerabilities in production dependencies"

      - name: Run unit tests with coverage
        run: npm run -w apps/web test:coverage

      - name: Check frontend coverage threshold (60%)
        run: |
          if [ ! -f "apps/web/coverage/coverage-summary.json" ]; then
            echo "⚠ Coverage file not found — skipping threshold check"
            exit 0
          fi

          # Extract total line coverage from vitest coverage JSON
          COVERAGE=$(node -e "
            const c = require('./apps/web/coverage/coverage-summary.json');
            const total = c.total || c;
            const pct = total.lines?.pct ?? total.lines?.percent ?? 0;
            console.log(pct);
          " 2>/dev/null || echo "0")

          echo "Frontend line coverage: ${COVERAGE}%"

          if awk "BEGIN {exit !($COVERAGE < 60)}"; then
            echo "❌ Frontend coverage ${COVERAGE}% is below 60%"
            exit 1
          fi
          echo "✅ Frontend coverage ${COVERAGE}% meets the 60% threshold"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-${{ github.run_number }}
          path: apps/web/coverage/
          retention-days: 14

      - name: Run shared UI package tests (@servicehub/ui-shared)
        # apps/web consumes this workspace package, but its ~500 tests were never executed in
        # CI — only apps/web's own suite was. Same command developers run locally, so a green
        # local run and a green CI run now mean the same thing for the shared package.
        run: npm run -w packages/servicehub-ui-shared test

      - name: Type check with TypeScript
        run: npm exec -w apps/web -- tsc -b

      - name: Verify production env file exists
        run: |
          if [ ! -f apps/web/.env.production ]; then
            echo "ERROR: apps/web/.env.production is missing. Create it with VITE_API_BASE_URL=/api/v1"
            exit 1
          fi

      - name: Build application
        run: npm run -w apps/web build

  build-experimental-apps:
    name: Build Experimental Apps (apps/demo, apps/sandbox)
    runs-on: ubuntu-latest
    # apps/demo and apps/sandbox are experimental, unsupported exploratory surfaces (see their
    # own README.md) — no test suite exists for either yet, so this job intentionally runs only
    # lint + typecheck + build, to catch a broken build or a type error introduced by a change
    # to packages/servicehub-ui-shared (which both apps consume) without pretending there is
    # behavioral test coverage that doesn't exist. Kept separate from build-and-test-frontend so
    # a failure here is clearly attributed to the experimental apps, not the supported product.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo workspace)
        run: npm ci --include=optional

      - name: Lint apps/demo
        run: npm run -w apps/demo lint

      - name: Lint apps/sandbox
        run: npm run -w apps/sandbox lint

      - name: Type check apps/demo
        run: npm exec -w apps/demo -- tsc -b

      - name: Type check apps/sandbox
        run: npm exec -w apps/sandbox -- tsc -b

      - name: Build apps/demo
        run: npm run -w apps/demo build

      - name: Build apps/sandbox
        run: npm run -w apps/sandbox build

  e2e-tests:
    name: E2E Tests (Playwright, Demo Mode)
    runs-on: ubuntu-latest
    # Gated on the frontend build/lint/typecheck job so a broken build doesn't also pay
    # for a browser install + test run. Demo Mode suites only (A–D) — fully client-side,
    # no backend or cloud credentials needed; playwright.config.ts starts its own dev server.
    needs: [build-and-test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (monorepo workspace)
        run: npm ci --include=optional

      - name: Install Playwright browsers
        run: npx --prefix apps/web playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run -w apps/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  container-smoke-test:
    name: Container Build & Health Check
    runs-on: ubuntu-latest
    # Gated on the existing build jobs so a failing unit test doesn't also pay for an
    # image build — `needs:` already fails this job if either upstream job doesn't succeed.
    needs: [build-and-test-backend, build-and-test-frontend]
    # Validates the exact path the README quick-start advertises (`docker compose up
    # --build`), not merely that the Dockerfile compiles: image build, container startup,
    # liveness, and that the SPA root is actually served.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Regression check - docker-compose.yml must not have hardcoded encryption key fallback
        run: |
          # Ensure docker-compose.yml does not have a hardcoded default SECURITY__ENCRYPTIONKEY.
          if grep -q '0a1715d2edbbbef62384ee797ed6bf7ce01ef56ee7da55dcc04fb7f297e53a4d' docker-compose.yml; then
            echo "❌ REGRESSION: Hardcoded encryption key found in docker-compose.yml"
            exit 1
          fi
          if grep 'SECURITY__ENCRYPTIONKEY:' docker-compose.yml | grep -q ':-'; then
            echo "❌ REGRESSION: Found fallback default (:-) for SECURITY__ENCRYPTIONKEY"
            exit 1
          fi
          echo "✅ PASSED: No hardcoded encryption key or fallback in docker-compose.yml"

      - name: Regression check - a fresh clone with no .env must fail fast, not crash-loop
        # The steps below inject the secrets via `env:`, so they exercise the maintainer's
        # path, never a true fresh clone (`.env` is gitignored and absent on a new checkout).
        # That is precisely how the v3.6.0 P0-1 defect survived this smoke test: the compose
        # file interpolated both secrets to empty strings and the container then crash-looped
        # on the Production configuration validator with `restart: unless-stopped` hiding it.
        # This step runs deliberately WITHOUT those env vars.
        run: |
          set +e
          OUTPUT=$(docker compose config 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "❌ REGRESSION: docker compose accepted a fresh clone with no secrets set."
            echo "   It must fail fast so a new user sees the cause instead of a restart loop."
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qE 'SECURITY__(ENCRYPTIONKEY|SPATOKEN__SECRET)'; then
            echo "❌ REGRESSION: the failure does not name the missing variable."
            echo "$OUTPUT"
            exit 1
          fi
          echo "✅ PASSED: fresh clone fails fast and names the missing variable"

      - name: Build and start container (docker compose up --build)
        env:
          SECURITY__ENCRYPTIONKEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210  # 32-byte test key for CI only
          SECURITY__SPATOKEN__SECRET: abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890  # test secret for CI only
        run: docker compose up --build -d

      - name: Wait for container health check
        run: |
          # The image's own HEALTHCHECK start-period is 25s, but .NET cold start on a
          # shared runner can exceed that — poll generously rather than trusting the
          # first health window.
          echo "Waiting for the container to become healthy (up to 180s)..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/live 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Container is healthy after $((i * 3))s (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  ...$((i * 3))s — HTTP $HTTP_CODE"
            sleep 3
          done
          echo "❌ Container did not become healthy within 180s"
          echo "--- docker compose ps ---"
          docker compose ps
          echo "--- Container logs ---"
          docker compose logs
          exit 1

      - name: Request SPA root and assert success
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "GET / -> HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ SPA root did not return 200"
            docker compose logs
            exit 1
          fi
          echo "✅ SPA root served successfully"

      - name: Tear down
        if: always()
        env:
          SECURITY__ENCRYPTIONKEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210  # 32-byte test key for CI only
          SECURITY__SPATOKEN__SECRET: abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890  # test secret for CI only
        run: docker compose down -v

  production-configuration-validation:
    name: Production Configuration Validation
    runs-on: ubuntu-latest
    # Validates that the app fails fast if production configuration is incomplete.
    # This proves that developers/operators cannot accidentally deploy to production
    # with placeholder or missing required configuration.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate app fails without SECURITY__ENCRYPTIONKEY
        run: |
          echo "Testing: App should fail to start if SECURITY__ENCRYPTIONKEY is missing"
          # Run with env var explicitly unset, should fail
          timeout 30 bash -c 'unset SECURITY__ENCRYPTIONKEY; docker compose up 2>&1' || true

          # Check that the container exited with error (not running healthcheck)
          RUNNING=$(docker compose ps --services --filter "status=running" 2>/dev/null || echo "")
          if [ -z "$RUNNING" ]; then
            echo "✅ Container correctly failed to start without SECURITY__ENCRYPTIONKEY"
          else
            echo "❌ Container should not have started without SECURITY__ENCRYPTIONKEY"
            docker compose logs servicehub
            exit 1
          fi
          docker compose down -v 2>/dev/null || true

      - name: Validate app fails with placeholder SECURITY__ENCRYPTIONKEY
        env:
          SECURITY__ENCRYPTIONKEY: SET_VIA_ENV_VAR
          SECURITY__SPATOKEN__SECRET: abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890  # test secret for CI only
        run: |
          echo "Testing: App should fail to start with placeholder SECURITY__ENCRYPTIONKEY"
          # Start with a placeholder value that should be rejected in Production
          docker compose up --build -d 2>&1

          # Give it 10 seconds to fail
          sleep 10

          # Check that container is NOT healthy
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/live 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "✅ Container correctly rejected placeholder SECURITY__ENCRYPTIONKEY (HTTP $HTTP_CODE)"
            docker compose down -v
            exit 0
          else
            echo "❌ Container should not have accepted placeholder SECURITY__ENCRYPTIONKEY"
            docker compose logs servicehub
            docker compose down -v
            exit 1
          fi

      - name: Validate app starts with valid SECURITY__ENCRYPTIONKEY
        env:
          SECURITY__ENCRYPTIONKEY: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210  # 32-byte test key for CI only
          SECURITY__SPATOKEN__SECRET: abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890  # test secret for CI only
        run: |
          echo "Testing: App should start successfully with valid SECURITY__ENCRYPTIONKEY"
          docker compose up --build -d 2>&1

          echo "Waiting for container to become healthy..."
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health/live 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Container started successfully with valid encryption key"
              docker compose down -v
              exit 0
            fi
            sleep 3
          done
          echo "❌ Container did not start with valid configuration"
          docker compose logs servicehub
          docker compose down -v
          exit 1

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-frontend, build-experimental-apps, e2e-tests, container-smoke-test, production-configuration-validation]
    if: always()

    steps:
      - name: Check build and test status
        run: |
          if [ "${{ needs.build-and-test-backend.result }}" != "success" ]; then
            echo "❌ Backend build/tests failed"
            exit 1
          fi
          if [ "${{ needs.build-and-test-frontend.result }}" != "success" ]; then
            echo "❌ Frontend build/tests failed"
            exit 1
          fi
          if [ "${{ needs.build-experimental-apps.result }}" != "success" ]; then
            echo "❌ Experimental apps (apps/demo, apps/sandbox) failed to build"
            exit 1
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [ "${{ needs.container-smoke-test.result }}" != "success" ]; then
            echo "❌ Container build/health check failed"
            exit 1
          fi
          if [ "${{ needs.production-configuration-validation.result }}" != "success" ]; then
            echo "❌ Production configuration validation failed"
            exit 1
          fi
          echo "✅ All builds, unit tests, and configuration validation passed!"

  container-security:
    name: Container Build, Scan & SBOM
    runs-on: ubuntu-latest
    # Validates the Dockerfile actually builds, scans the image for known CVEs, and
    # publishes a CycloneDX SBOM as a build artifact. Does not push the image.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: servicehub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: servicehub:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate CycloneDX SBOM from image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: servicehub:ci
          scan-type: image
          format: cyclonedx
          output: servicehub-sbom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_number }}
          path: servicehub-sbom.cdx.json
          retention-days: 30
          if-no-files-found: ignore
