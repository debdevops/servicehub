# CodeQL Security Scan — SAST for C# and TypeScript
# Scans source code for vulnerabilities: SQL injection, XSS, path traversal,
# insecure crypto, unsafe deserialization, hardcoded credentials, and more.
# Results appear in: Security tab → Code scanning alerts
# Cost: FREE on public GitHub repositories
name: CodeQL Security Scan

on:
  push:
    branches:
      - main
      - develop
      - 'release'
      - 'bugfix/**'
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release'
      - 'bugfix/**'
      - 'feat/**'
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'

  schedule:
    # Run full scan weekly on Sunday at 2 AM IST (8:30 PM UTC Saturday)
    - cron: '30 20 * * 6'

# 4.1.0 lives at the repository root (`services/api`, `apps/servicehub`). The frozen 4.0.0 tree under archive/ is neither
# built nor scanned here (it is excluded in .github/codeql/codeql-config.yml): until 2026-10-03 this workflow built and
# scanned ONLY archive/servicehub-4.0.0, so no 4.1.0 code was ever analysed.

jobs:
  analyze-csharp:
    name: Scan C# (.NET Backend)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # Required to upload CodeQL results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL for C#
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          config-file: .github/codeql/codeql-config.yml
          # Use extended security queries for broader coverage
          queries: security-extended

      - name: Restore dependencies
        run: dotnet restore services/api/ServiceHub.slnx

      - name: Build for CodeQL analysis
        # CodeQL needs to observe the build to understand the code
        run: |
          dotnet build services/api/ServiceHub.slnx \
            --configuration Release \
            --no-restore

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  analyze-typescript:
    name: Scan TypeScript (React Frontend)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Initialize CodeQL for TypeScript
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
          queries: security-extended

      - name: Install dependencies (monorepo workspace)
        run: npm ci

      - name: Build for CodeQL analysis
        # A type-check helps CodeQL resolve types accurately; it is not a gate here (CI's own job is).
        run: npx tsc -b
        working-directory: apps/servicehub
        continue-on-error: true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
