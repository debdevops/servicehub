# ServiceHub 4.1.0, locally.
#
#   docker compose up --build        → http://localhost:8080
#
# ServiceHub 4.0.0 is a separate stack with its own compose file:
#   cd archive/servicehub-4.0.0 && docker compose up
services:
  servicehub:
    build:
      context: .
      dockerfile: Dockerfile
    image: servicehub:4.1.0-dev
    ports:
      - "8080:8080"
    volumes:
      # The SQLite database. One instance, one file — ADR-0003, and the instance lock enforces it.
      - servicehub-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

volumes:
  servicehub-data:
