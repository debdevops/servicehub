# ServiceHub — zero-credential demo via Docker Compose.
#
#   docker compose up --build
#   → open http://localhost:8080  (seeds synthetic Azure + AWS + GCP namespaces)
#
# This runs Simulator mode: no cloud credentials, no secrets, nothing to configure.
# For a real deployment see the "production" service below and self-hosting/README.md.
services:
  servicehub:
    build:
      context: .
      dockerfile: Dockerfile
    image: servicehub:local
    ports:
      # Loopback-bound: Simulator profile runs with auth/rate-limit/encryption
      # disabled, so it must not be reachable from the network.
      # For deliberate LAN exposure, change to: - "0.0.0.0:8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Simulator
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    depends_on:
      - servicehub-ai

  # Skeleton only (no algorithm yet) — internal network only, never publish this
  # port to the host. servicehub must start/serve normally if this is absent or
  # unhealthy, hence no `condition: service_healthy` on the depends_on above.
  servicehub-ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    image: servicehub-ai:local
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # Production example — connect to real cloud messaging. Uncomment, then supply a random key:
  #   SECURITY__ENCRYPTIONKEY=$(openssl rand -hex 32) docker compose up -d servicehub-prod
  # Data (namespace store + SQLite DLQ/audit DB) is persisted to the named volume.
  # ---------------------------------------------------------------------------------------
  # servicehub-prod:
  #   build: { context: ., dockerfile: Dockerfile }
  #   image: servicehub:local
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     SECURITY__ENCRYPTIONKEY: ${SECURITY__ENCRYPTIONKEY:?set a 32-byte random hex key}
  #     # Enable preview providers if needed:
  #     # CloudProviders__Aws__Enabled: "true"
  #     # CloudProviders__Gcp__Enabled: "true"
  #   volumes:
  #     - servicehub-data:/var/servicehub/data
  #   restart: unless-stopped

volumes:
  servicehub-data:
