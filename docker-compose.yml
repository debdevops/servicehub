# ServiceHub — build and run via Docker Compose.
#
#   cp .env.example .env
#   printf 'SECURITY__ENCRYPTIONKEY=%s\n' "$(openssl rand -hex 32)" >> .env
#   printf 'SECURITY__SPATOKEN__SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
#   docker compose up --build
#   → open http://localhost:8080, then connect a namespace with your own cloud credentials
#
# The two secrets have no defaults by design — a shipped default encryption key would
# be identical across every deployment that never overrode it. Compose fails fast with
# the generation command if either is missing, rather than starting a container that
# crash-loops on the Production configuration validator.
#
# Evidence (the SQLite DLQ/audit/recovery-ledger database and the namespace store) persists to
# the named `servicehub-data` volume by default — `docker compose down` keeps it; only
# `docker compose down -v` discards it.
#
# For a zero-credential exploration of the UI without any backend, see Demo Mode
# (apps/web — no container required). For a LAN-exposed deployment connecting to real cloud
# messaging, see the "production" example service below and self-hosting/README.md.
services:
  servicehub:
    build:
      context: .
      dockerfile: Dockerfile
    image: servicehub:local
    ports:
      # Loopback-bound by default; for deliberate LAN exposure, change to: - "0.0.0.0:8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      # Production, not Development: this is the single self-contained image the README
      # quick-start advertises (SPA served at / from wwwroot) — Development mode skips
      # UseStaticFiles/MapFallbackToFile and redirects / to /scalar/v1 instead, since it
      # assumes a separate `npm run dev` frontend on :3000, which this container doesn't run.
      ASPNETCORE_ENVIRONMENT: Production
      # SECURITY: SECURITY__ENCRYPTIONKEY is required and must be generated per-deployment.
      # DO NOT use a default or hardcoded value. Generate a random key per deployment:
      #   SECURITY__ENCRYPTIONKEY=$(openssl rand -hex 32) docker compose up --build
      # Reusing the same key across deployments or checking keys into version control
      # compromises connection-string encryption for every namespace stored with that key.
      #
      # To rotate this key later without losing access to already-stored connection strings,
      # switch to SECURITY__ENCRYPTIONKEYREGISTRY instead (takes precedence over this variable
      # when set) — a JSON blob naming an ActiveKeyId plus every key still needed to decrypt
      # older data. See docs/ENCRYPTION-KEY-ROTATION.md for the full procedure; do not put a
      # registry with real key material in this file — env var or secret store only.
      SECURITY__ENCRYPTIONKEY: "${SECURITY__ENCRYPTIONKEY:?is not set. Copy .env.example to .env and fill in both secrets, then re run docker compose up. See .env.example for the generate commands.}"
      # appsettings.Production.json's AllowedHosts placeholder rejects every Host header
      # until overridden; this container is only reachable via localhost per the ports mapping.
      AllowedHosts: localhost
      # SiteUrl for CORS and SPA token validation
      SITEURL: ${SITEURL:-http://localhost:8080}
      # SECURITY: SPA token signing secret — required, no default. Generate per-deployment:
      #   SECURITY__SPATOKEN__SECRET=$(openssl rand -hex 32) docker compose up --build
      SECURITY__SPATOKEN__SECRET: "${SECURITY__SPATOKEN__SECRET:?is not set. Copy .env.example to .env and fill in both secrets, then re run docker compose up. See .env.example for the generate commands.}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
    depends_on:
      - servicehub-ai
    # Named, tracked volume for the SQLite DLQ/audit/evidence database and the namespace store —
    # both already write here by default (DlqDatabase__DataDirectory / NamespaceRepository__DataDirectory
    # in the Dockerfile). Without this mount, Docker still creates an anonymous volume for the
    # Dockerfile's VOLUME declaration, but a fresh anonymous volume is allocated on every
    # `docker compose down && up`, silently discarding the evidence ledger. Naming it here is what
    # makes `docker compose down` (no `-v`) keep it, and `docker compose down -v` the explicit,
    # deliberate way to discard it.
    volumes:
      - servicehub-data:/var/servicehub/data

  # TF-IDF + DBSCAN error-signature clustering (services/ai/app/clustering.py) — internal
  # network only, never publish this port to the host. servicehub must start/serve normally
  # if this is absent or unhealthy, hence no `condition: service_healthy` on the depends_on
  # above.
  servicehub-ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    image: servicehub-ai:local
    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # LAN-exposed example — same persisted volume as the default `servicehub` service above;
  # the only difference is the port binding. Uncomment, then supply a random key:
  #   SECURITY__ENCRYPTIONKEY=$(openssl rand -hex 32) docker compose up -d servicehub-prod
  # ---------------------------------------------------------------------------------------
  # servicehub-prod:
  #   build: { context: ., dockerfile: Dockerfile }
  #   image: servicehub:local
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     SECURITY__ENCRYPTIONKEY: ${SECURITY__ENCRYPTIONKEY:?set a 32-byte random hex key}
  #     # Enable preview providers if needed:
  #     # CloudProviders__Aws__Enabled: "true"
  #     # CloudProviders__Gcp__Enabled: "true"
  #   volumes:
  #     - servicehub-data:/var/servicehub/data
  #   restart: unless-stopped

volumes:
  servicehub-data:
